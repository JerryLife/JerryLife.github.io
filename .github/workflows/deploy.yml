name: Build and deploy site

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "_data/**"
      - "_news/**"
      - "_pages/**"
      - "_sass/**"
      - "_scripts/**"
      - "_layouts/**"
      - "_includes/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**.md"
      - "**.yml"
      - "scripts/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "requirements.txt"
      - "purgecss.config.js"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - main
    paths:
      - "assets/**"
      - "_data/**"
      - "_news/**"
      - "_pages/**"
      - "_sass/**"
      - "_scripts/**"
      - "_layouts/**"
      - "_includes/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**.md"
      - "**.yml"
      - "scripts/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "requirements.txt"
      - "purgecss.config.js"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip3 install --upgrade -r requirements.txt

      - name: Validate editable content
        run: python3 scripts/build_cv_content.py validate

      - name: Render derived CV content
        run: python3 scripts/build_cv_content.py build

      # pdfTeX stamps /CreationDate, /ModDate and /ID from the wall clock, so an
      # unpinned build produces a different PDF byte-for-byte on every run.
      - name: Pin reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Compile PDF resume
        uses: xu-cheng/latex-action@v4
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          FORCE_SOURCE_DATE: "1"
        with:
          root_file: ZhaominWu.tex
          working_directory: assets/latex
          texlive_version: 2025
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Stage PDF for the site
        run: |
          test -f assets/latex/ZhaominWu.pdf
          cp assets/latex/ZhaominWu.pdf assets/pdf/ZhaominWu.pdf

      - name: Update generated site configuration
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}

      - name: Build Jekyll site
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Upload derived CV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-derived-${{ github.sha }}
          if-no-files-found: error
          path: |
            assets/json/resume.json
            _data/generated/content.yml
            _bibliography/papers.bib
            _bibliography/publications.bib
            _bibliography/preprints.bib
            assets/latex/generated/
            assets/pdf/ZhaominWu.pdf

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: built-site-${{ github.sha }}
          if-no-files-found: error
          path: _site/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download derived CV artifacts
        uses: actions/download-artifact@v4
        with:
          name: cv-derived-${{ github.sha }}
          path: .

      # Bookkeeping only: never let it block the deployment below. `main` can
      # advance while this run is building (the "Update TOCs" workflow pushes
      # after any root *.md change), which makes a plain `git push` a
      # non-fast-forward rejection. Rebase and retry, then give up quietly.
      - name: Commit generated CV artifacts
        continue-on-error: true
        run: |
          set -u
          git add -A -- assets/json/resume.json _data/generated/content.yml _bibliography/papers.bib _bibliography/publications.bib _bibliography/preprints.bib assets/latex/generated assets/pdf/ZhaominWu.pdf
          if git diff --cached --quiet; then
            echo "Generated artifacts unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate CV artifacts"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Pushed regenerated CV artifacts on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto the latest branch tip."
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase "origin/${{ github.ref_name }}"; then
              git rebase --abort || true
              echo "::warning::Could not rebase regenerated CV artifacts; skipping this bookkeeping commit."
              exit 0
            fi
          done
          echo "::warning::Could not push regenerated CV artifacts after 3 attempts; the site is still deployed below."
          exit 0

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: built-site-${{ github.sha }}
          path: _site

      - name: Deploy site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
