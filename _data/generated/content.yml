          Finance](https://finance.sina.com.cn/stock/t/2026-01-23/doc-inhihniy2053260.shtml)
          (新浪财经), [Sohu](https://m.sohu.com/a/979238835_473283) (搜狐), [BAAI Hub](https://hub.baai.ac.cn/view/52063)
          (智源社区), [Tencent Cloud Developer Community](https://cloud.tencent.com/developer/article/2623954)
          (腾讯云开发者社区).'
