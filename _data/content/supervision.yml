schema_version: 1
members:
  - name: Jiayi Li
    role: Senior RA
    education:
      - degree: Master
        institution: NUS
      - degree: BSc Hons
        institution: University of Nottingham
openings_summary: >-
  I have openings for **Postdocs**, **Ph.D. students**,
  and **Research Assistants (RAs)** to join and shape my new research group at Hong Kong Baptist University.
start_note: I will join HKBU in January 2027. Start dates can be discussed individually.
opportunities:
  - title: Founding Member
    description: Join and shape a new research group from day one.
  - title: Hands-on Mentorship
    description: Hands-on guidance and close collaboration throughout your research.
  - title: Top-Tier Research
    description: Target publications at top-tier venues through rigorous, practical research.
  - title: Competitive Funding
    description: Funded PhD · HK$19K+/month. HKPFS application support for strong applicants.
funding_details: |
  Regular PhD studentship: **HK$19,310/month** at the published 2026/27 rate; tuition fees apply. See [HKBU studentship and fee details](https://gs.hkbu.edu.hk/fees-scholarships-and-financial-aid) for current terms.

  Strong applicants will be supported in applying for **HKPFS**. Successful awardees in HKBU Computer Science receive a combined RGC, HKBU, and departmental stipend of **HK$50,000/month**, plus tuition waiver. Continued support and tuition waivers are subject to satisfactory performance and university terms. See the [HKBU Computer Science fellowship package](https://www.comp.hkbu.edu.hk/v1/?page=hkpfs-info).
requirements:
  - "**Location:** Work onsite at HKBU."
  - "**English:** Professional work efficiency ([HKBU admission requirements](https://gs.hkbu.edu.hk/admission/research-postgraduate-programmes/application/admission-requirements))."
  - "**Skills:** Strong foundations in programming, machine learning, systems, algorithms, or mathematics; interdisciplinary experience is a plus."
principles:
  - A professor's success is measured primarily by their students' success, beyond publications and grants.
  - Students work with their supervisors, not for them, as partners in research.
criteria:
  - title: Responsible
    description: Honesty and reliability in honoring commitments.
  - title: Proactive
    description: Initiative in seeking advisors' input and sharing updates.
  - title: Persistent
    description: Resilience through setbacks and openness to advice.
  - title: Curious
    description: An eagerness to explore the unknown and understand why.
contact:
  subject: "HKBU [Position] Application - [Name]"
  introduction: |
    Please email me your **CV**, **academic transcript**, and a **research description (under 100 words)**. Include your research area, intended start date, and expected duration in the email.

    Subject format: **HKBU [Position] Application - [Name]**. Use PhD, RA, or Postdoc for the position.

    Example: HKBU PhD Application - Alex Chen
  questions:
    - Briefly describe your research background (if any) and your favorite work (a paper, thesis, or project).
    - Why would you like to work with me?
    - Which of my research directions or papers connects most closely with your interests?
mentoring_intro: >-
  I have mentored undergraduate, master's, and visiting Ph.D. students
  at the National University of Singapore.
