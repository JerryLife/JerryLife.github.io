title: Research Profile
body: >-
  I am an incoming tenure-track Assistant Professor at Hong Kong Baptist University
  (HKBU), starting in January 2027. I am currently an NRF Postdoctoral Fellow at the
  National University of Singapore (NUS).
  My research focuses on federated learning, multi-agent systems, and the two-way
  relationship between AI and psychology. My work has appeared in NeurIPS, ICLR,
  SIGMOD, KDD, and ACL, with two ICLR 2026 Oral papers, a SIGMOD 2023 Honorable
  Mention for Best Artifact, and 3000+ Google Scholar citations. I serve as an
  Area Chair for ICLR 2027 and ACL Rolling Review (ARR).
