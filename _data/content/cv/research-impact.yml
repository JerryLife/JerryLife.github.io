schema_version: 1
title: Research Impact
supplemental: platform metrics recorded in May 2026
groups:
  - title: Open-Source Systems and Benchmarks
    items:
      - name: FedTree
        url: https://github.com/Xtra-Computing/FedTree
        venue: MLSys'23
        description: an open-source federated learning system for tree-based models; it supports reproducible and privacy-preserving GBDT training across parties. 152 GitHub stars and 41 forks.
      - name: VertiBench
        url: https://github.com/Xtra-Computing/VertiBench
        venue: ICLR'24
        description: a public benchmark for systematically evaluating vertical federated learning under varying feature-diversity settings; it standardizes evaluation beyond single synthetic data splits and is released as an installable PyPI package.
      - name: WikiDBGraph
        url: https://huggingface.co/datasets/Jerrylife/WikiDBGraph
        venue: ICDE'26
        description: a large-scale database graph of Wikidata for collaborative learning; it releases 100,000 database nodes and 17 million edges for database-silo learning research.
      - name: LLM DNA
        url: https://github.com/Xtra-Computing/LLM-DNA
        venue: ICLR'26 Oral
        description: an open-source toolkit for extracting functional DNA signatures and tracing LLM evolution from model behavior, with a public project website and PyPI package.
      - name: OARF
        url: https://github.com/Xtra-Computing/OARF
        venue: ACM TIST'22
        description: a benchmark suite for characterizing federated learning systems; it provides reusable workloads for system-level FL comparison.
