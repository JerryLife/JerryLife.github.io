    Zhaomin Wu is an incoming tenure-track Assistant Professor at Hong Kong Baptist University (January 2027)
    and a Research Fellow at NUS. His research connects fragmented knowledge through federated learning and multi-agent systems, with a focus on the relationship between AI agents and psychology.
