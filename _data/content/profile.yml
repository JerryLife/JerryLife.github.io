  body: |
    I am a Research Fellow at the National University of Singapore (NUS) and a recipient of the **Singapore NRF Postdoctoral Award (2026)**. I received my Ph.D. in Computer Science from NUS in 2024, advised by [Bingsheng He](https://www.comp.nus.edu.sg/~hebs/), and my B.Eng. from Huazhong University of Science and Technology in 2019. My work spans machine learning, databases, and data mining, with publications at NeurIPS, ICLR, SIGMOD, KDD, and ACL. I serve as an Area Chair for ICLR.

