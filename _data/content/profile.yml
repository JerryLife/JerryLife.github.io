    Incoming Assistant Professor (tenure-track) · January 2027<br>Department of Computer Science<br><a href='https://www.hkbu.edu.hk/'>Hong Kong Baptist University</a>
  body: |
    I will join Hong Kong Baptist University (HKBU) as a **tenure-track Assistant Professor** in **January 2027**. I am a Research Fellow at the National University of Singapore (NUS) and a recipient of the Singapore NRF Postdoctoral Award (2026). I received my Ph.D. in Computer Science from NUS in 2024, advised by [Bingsheng He](https://www.comp.nus.edu.sg/~hebs/), and my B.Eng. from Huazhong University of Science and Technology in 2019. My work has appeared at leading venues in machine learning, databases, and data mining, such as NeurIPS, ICLR, SIGMOD, KDD, and ACL. I serve as an Area Chair (AC) for premier machine learning conferences such as ICLR.

    My research focuses on federated learning across data silos and multi-agent systems that bridge knowledge distributed across models. I see future AI agents as individuals whose behavior and social interactions deserve study. I aim to use psychology to understand agents and their communities, and in turn use agents to advance psychology and social science research.

