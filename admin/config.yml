                  - label: Period
                    name: period
                    widget: string
                    required: false
                  - label: Institution
                    name: institution
                    widget: string
                    required: false
                  - label: Teaching role
                    name: role
                    widget: string
                    required: false
                  - label: URL
                    name: url
                    widget: string
                    required: false
