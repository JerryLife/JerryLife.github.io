        fields:
          - label: Schema version
            name: schema_version
            widget: hidden
            default: 1
          - { label: Section title, name: title, widget: string }
          - label: Entries
            name: entries
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.year}} - {{fields.name}}"
            fields:
              - label: Year
                name: year
                widget: number
                value_type: int
                min: 1900
                max: 2100
                step: 1
              - { label: Recognition, name: name, widget: string }
              - { label: Detail, name: role, widget: string, required: false }
              - { label: URL, name: url, widget: string, required: false }
      - name: tutorial
        label: Tutorial Speaker
        file: _data/content/service/tutorial.yml
        fields:
          - label: Schema version
            name: schema_version
            widget: hidden
            default: 1
          - { label: Section title, name: title, widget: string }
          - label: Entries
            name: entries
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.year}} - {{fields.name}}"
