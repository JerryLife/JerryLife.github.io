# This site is served statically by GitHub Pages. The OAuth exchange is handled
# by a separate Cloudflare Worker, so no client secret is exposed in this repo.
backend:
  name: github
  repo: JerryLife/JerryLife.github.io
  branch: main
  # Use the Worker origin only; do not include a trailing slash or `/auth`.
  base_url: https://zhaominwu-cms-auth.jerrylifewzm.workers.dev
  auth_endpoint: auth
  site_domain: www.zhaominwu.com

# On localhost, Decap switches to the local proxy so the editor reads and writes
# this working tree instead of the remote GitHub branch. Production keeps the
# GitHub backend above.
local_backend:
  url: http://localhost:8081/api/v1
  allowed_hosts: [localhost, 127.0.0.1]

media_folder: assets/img/uploads
public_folder: /assets/img/uploads

collections:
  - name: news
    label: News
    label_singular: News item
    folder: _news
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} - {{title}}"
    fields:
      - label: Title
        name: title
        widget: string
        required: false
        default: News item
      - label: Date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: Show inline on the news list
        name: inline
        widget: boolean
        default: true
      - label: Layout
        name: layout
        widget: hidden
        default: post
      - label: Related posts
        name: related_posts
        widget: hidden
        default: false
      - label: Content
        name: body
        widget: markdown

  - name: publications
    label: Publications
    label_singular: Publication
    folder: _data/content/publications
    create: true
    extension: bib
    format: bibtex
    slug: "{{citation_key}}"
    identifier_field: citation_key
    summary: "{{citation_key}}"
    fields:
      - label: Citation key
        name: citation_key
        widget: hidden
        default: publication
      - label: BibTeX entry
        name: body
        widget: code
        default_language: bibtex
        output_code_only: true
        hint: Paste exactly one complete BibTeX publication entry. Its key and filename must use lowercase firstauthorYYYYshorttitle, for example wu2026llmdna.bib; no underscores, punctuation, DOI, or DBLP keys. Use selected = {true} for the website home-page selection, and cv_selected = {true} with cv_order = {1}, {2}, ... for the CV selection; these are independent. arXiv records are classified as Preprints automatically.

  - name: service
    label: Service
    files:
      - name: conference-reviewers
        label: Conference Reviewers
        file: _data/content/service/conference-reviewers.yml
        fields:
          - label: Schema version
            name: schema_version
            widget: hidden
            default: 1
          - { label: Section title, name: title, widget: string }
          - label: Entries
            name: entries
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.year}} - {{fields.name}}"
            fields:
              - label: Year
                name: year
                widget: number
                value_type: int
                min: 1900
                max: 2100
                step: 1
              - { label: Conference, name: name, widget: string }
              - label: Role
                name: role
                widget: string
                required: false
                default: Reviewer
              - label: URL
                name: url
                widget: string
                required: false
      - name: journal-reviewers
        label: Journal Reviewers
        file: _data/content/service/journal-reviewers.yml
        fields:
          - label: Schema version
            name: schema_version
            widget: hidden
            default: 1
          - { label: Section title, name: title, widget: string }
          - label: Entries
            name: entries
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.year}} - {{fields.name}}"
            fields:
              - label: Year
                name: year
                widget: number
                value_type: int
                min: 1900
                max: 2100
                step: 1
              - { label: Journal, name: name, widget: string }
              - label: Role
                name: role
                widget: string
                required: false
                default: Reviewer
              - label: URL
                name: url
                widget: string
                required: false
      - name: recognition
        label: Recognition
