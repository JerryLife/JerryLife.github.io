              - label: Year
                name: year
                widget: number
                value_type: int
                min: 1900
                max: 2100
                step: 1
              - { label: Tutorial, name: name, widget: string }
              - { label: Role, name: role, widget: string, required: false, default: Tutorial Speaker }
              - { label: URL, name: url, widget: string, required: false }

